# bookorbit — self-hosted reading platform: ebooks, comics, audiobooks, with
# Kobo/KOReader progress sync. https://bookorbit.app
#
# Adapted from upstream's docker-compose.yml, with three changes this repo
# requires: `expose:` plus caddy labels instead of a published port, named
# volumes instead of the upstream `./data/...` binds (Komodo clones stacks to
# /etc/komodo/stacks/<name>/, so a relative path anchors there), and the
# secrets referenced from services.toml rather than a .env in the repo.
#
# Declared in ../komodo/syncs/services.toml.

services:
  bookorbit:
    image: ghcr.io/bookorbit/bookorbit:latest
    container_name: bookorbit-app
    restart: unless-stopped
    # The app spawns scanner/converter children; without an init they pile up.
    init: true
    expose: ["3000"]
    networks: [backend, caddy]
    environment:
      NODE_ENV: production
      PORT: 3000
      POSTGRES_HOST: bookorbit-db
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-bookorbit}
      POSTGRES_DB: ${POSTGRES_DB:-bookorbit}
      # Each defaults to its own key name so the stack still comes up if a
      # variable is missing — placeholders, not secrets. The real values are
      # Komodo secrets, injected via the environment block in services.toml,
      # which overrides these.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:-JWT_SECRET}
      SETUP_BOOTSTRAP_TOKEN: ${SETUP_BOOTSTRAP_TOKEN:-SETUP_BOOTSTRAP_TOKEN}
      # Not cosmetic: the Kobo sync endpoints and outgoing email build their
      # URLs from this, so a wrong value produces links devices cannot reach.
      APP_URL: https://bookorbit.namanvashistha.com
      # Caps the library folder picker at the mount, instead of showing the
      # whole container root.
      LIBRARY_BROWSE_ROOT: /books
      TZ: ${TZ:-Asia/Kolkata}
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
    volumes:
      # The library, on an absolute host path — the one bind mount that should
      # NOT be a named volume, since these are files you manage outside docker.
      # Change this to wherever the library actually lives; docker will happily
      # create an empty /mnt/books and scan nothing.
      - /mnt/books:/books
      - bookorbit-data:/data
    depends_on:
      bookorbit-db:
        condition: service_healthy
    labels:
      caddy: http://bookorbit.namanvashistha.com
      caddy.reverse_proxy: "{{upstreams 3000}}"
    # Upstream's hardening, kept as-is: immutable rootfs, no ambient
    # capabilities beyond the ones the permission fixer needs.
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    security_opt: ["no-new-privileges:true"]
    stop_grace_period: 30s

  # pgvector, not stock postgres: the schema needs the `vector` extension
  # alongside uuid-ossp and pg_trgm.
  bookorbit-db:
    image: pgvector/pgvector:pg18
    container_name: bookorbit-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bookorbit}
      POSTGRES_DB: ${POSTGRES_DB:-bookorbit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-POSTGRES_PASSWORD}
      # A subdirectory, not the mount root — postgres refuses to initdb into a
      # directory containing lost+found.
      PGDATA: /var/lib/postgresql/data/pgdata
    # Private to this stack. The database has no business being reachable from
    # the shared caddy network.
    networks: [backend]
    volumes:
      - bookorbit-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

networks:
  backend:
  # Created by bootstrap/deploy.sh, shared by every stack on the box.
  caddy:
    external: true

volumes:
  bookorbit-data:
  bookorbit-db-data:
