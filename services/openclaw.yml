# openclaw — self-hosted AI gateway (github.com/openclaw/openclaw), pointed at
# OpenRouter's free-tier models.
#
# Tools run inside this container only: no docker.sock mount, so it cannot
# spawn sandboxed sessions on the host. That keeps the blast radius of a
# leaked token to this one container.
#
# OPENCLAW_GATEWAY_TOKEN is required, unlike upstream's own compose where it
# defaults to empty. This container sits on the `caddy` network (reachable by
# every other stack on the box) and behind the tunnel (reachable by the
# internet) — the token is what actually gates access, the caddy label alone
# does not. Add a Cloudflare Access policy on openclaw.namanvashistha.com too,
# the same way komodo.namanvashistha.com has one (see README's first-run
# section) — Access and the gateway token are two independent locks, not a
# substitute for each other.
#
# Model choice (agents.defaults.model) is OPENCLAW_MODEL below — change the
# default there, or override per-deploy with a Komodo variable
# OPENCLAW_MODEL=[[OPENCLAW_MODEL]] on this stack's `environment` in
# services.toml. It only takes effect on first boot (see the bootstrap note
# below); after that, change it with `openclaw models set` or the Control UI.
#
# gateway.json lives in openclaw.json inside the state volume, generated once
# by `openclaw onboard` — not by any env var. Upstream expects that run
# interactively or over SSH, which doesn't fit "push and it deploys". Instead
# `command` below runs onboarding itself, non-interactively, the first time
# the container starts with no config on the volume, then execs the real
# gateway. Redeploys after that see openclaw.json already there and skip
# straight to the gateway — this block never touches an existing config.
#
# The gateway also refuses proxied requests ("proxy_attribution_required")
# until it knows which IP to trust as its reverse proxy. caddy_proxy's
# container IP on the `caddy` network isn't fixed, so every start resolves it
# fresh over Docker's embedded DNS and writes it to gateway.trustedProxies —
# this only narrows rate-limit/audit attribution to the real proxy hop, it is
# not what gates access (the gateway token is).
#
# Separately, the Control UI (the browser app) checks its own page origin
# against gateway.controlUi.allowedOrigins before it will even open a
# connection — unrelated to trustedProxies above. Reasserted every boot too,
# same as trustedProxies, so it self-heals on an already-onboarded volume.
#
# Two more free-tier-specific fixups, also reasserted every boot:
#   - the default minimax-m3:free route on OpenRouter rejects OpenClaw's
#     auto-computed max_tokens (derived from the model's huge advertised
#     context, not its real output cap) with a 400 — pin a sane maxTokens.
#   - OpenClaw's memory/session sync defaults to OpenAI embeddings, which
#     we have no key for; OpenRouter isn't a supported embeddings backend
#     either, so this pins memory search to FTS-only (`"none"`) instead of
#     adding a second provider just for that.
#
# Telegram is the actual daily-driver interface (the iOS app needs either
# Tailscale or a Cloudflare Access rework to pair correctly — see the repo
# history — so Telegram sidesteps that entirely). OpenClaw's automatic env
# fallback only looks for the bare name TELEGRAM_BOT_TOKEN, so keeping the
# OPENCLAW_ prefix on ours means pointing channels.telegram.botToken at it
# explicitly as a SecretRef instead of relying on that fallback — one extra
# config-set line, still no plaintext token in openclaw.json. The channel
# still defaults to enabled: false and dmPolicy: "pairing" — open to anyone
# who finds the bot — so both are pinned down too, every boot.
#
# gh (GitHub CLI) isn't in the vendor image and this repo never builds its
# own — "the box never builds" — so it's fetched straight from GitHub's
# releases into /home/node/.local/bin (already on PATH, no root needed) the
# first time the container starts, using node's built-in fetch since the
# image ships no curl/wget. Persisted on its own volume so it survives
# restarts instead of re-downloading every boot. Best-effort: a failure here
# (offline, GitHub unreachable, unknown arch) never blocks the gateway from
# starting — the whole block is wrapped to swallow its own errors.
#
# Declared in ../komodo/syncs/services.toml.

services:
  openclaw:
    image: openclaw/openclaw:latest
    container_name: openclaw
    restart: unless-stopped
    cap_drop:
      - NET_RAW
      - NET_ADMIN
    security_opt:
      - no-new-privileges:true
    environment:
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN:?OPENCLAW_GATEWAY_TOKEN is required}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:?OPENROUTER_API_KEY is required}
      OPENCLAW_TELEGRAM_BOT_TOKEN: ${OPENCLAW_TELEGRAM_BOT_TOKEN:?OPENCLAW_TELEGRAM_BOT_TOKEN is required}
      OPENCLAW_TELEGRAM_USER_ID: ${OPENCLAW_TELEGRAM_USER_ID:?OPENCLAW_TELEGRAM_USER_ID is required}
      OPENCLAW_MODEL: ${OPENCLAW_MODEL:-openrouter/minimax/minimax-m3:free}
      OPENCLAW_GATEWAY_PORT: "18789"
      OPENCLAW_STATE_DIR: /home/node/.openclaw
      OPENCLAW_CONFIG_PATH: /home/node/.openclaw/openclaw.json
      OPENCLAW_CONFIG_DIR: /home/node/.openclaw
      OPENCLAW_WORKSPACE_DIR: /home/node/.openclaw/workspace
    volumes:
      - openclaw-state:/home/node/.openclaw
      - openclaw-auth-secrets:/home/node/.config/openclaw
      - openclaw-local:/home/node/.local
    expose: ["18789"]
    networks: [caddy]
    labels:
      caddy: http://openclaw.namanvashistha.com
      caddy.reverse_proxy: "{{upstreams 18789}}"
    init: true
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        if [ ! -f "$$OPENCLAW_CONFIG_PATH" ]; then
          node dist/index.js onboard --non-interactive --accept-risk --skip-health \
            --mode local \
            --auth-choice openrouter-api-key \
            --secret-input-mode ref \
            --gateway-auth token \
            --gateway-token-ref-env OPENCLAW_GATEWAY_TOKEN \
            --gateway-bind lan \
            --skip-channels \
            --no-install-daemon
          node dist/index.js models set "$$OPENCLAW_MODEL"
        fi
        node dist/index.js config set gateway.controlUi.allowedOrigins \
          '["https://openclaw.namanvashistha.com"]' --strict-json
        CADDY_IP="$$(node -e "require('dns').resolve4('caddy_proxy',(e,a)=>{if(e)process.exit(1);process.stdout.write(a[0])})" 2>/dev/null)" || true
        if [ -n "$$CADDY_IP" ]; then
          node dist/index.js config set gateway.trustedProxies "[\"$$CADDY_IP\"]" --strict-json
        fi
        node dist/index.js config set agents.defaults.models \
          '{"openrouter/minimax/minimax-m3:free":{"params":{"maxTokens":8192}}}' \
          --strict-json --merge
        node dist/index.js config set memory.search.provider '"none"' --strict-json
        node dist/index.js config set channels.telegram.enabled true --strict-json
        node dist/index.js config set channels.telegram.botToken \
          --ref-provider default --ref-source env --ref-id OPENCLAW_TELEGRAM_BOT_TOKEN
        node dist/index.js config set channels.telegram.dmPolicy '"allowlist"' --strict-json
        node dist/index.js config set channels.telegram.allowFrom \
          "[\"$$OPENCLAW_TELEGRAM_USER_ID\"]" --strict-json
        (
          set -e
          if [ ! -x /home/node/.local/bin/gh ]; then
            GH_ARCH=""
            case "$$(uname -m)" in
              x86_64) GH_ARCH=amd64 ;;
              aarch64|arm64) GH_ARCH=arm64 ;;
            esac
            if [ -n "$$GH_ARCH" ]; then
              GH_VERSION="$$(node -e "fetch('https://api.github.com/repos/cli/cli/releases/latest',{headers:{'user-agent':'openclaw-homelab'}}).then(r=>r.json()).then(j=>process.stdout.write(j.tag_name.replace(/^v/,'')))")"
              GH_URL="https://github.com/cli/cli/releases/download/v$${GH_VERSION}/gh_$${GH_VERSION}_linux_$${GH_ARCH}.tar.gz"
              node -e "fetch(process.argv[1]).then(r=>r.arrayBuffer()).then(b=>require('fs').writeFileSync(process.argv[2],Buffer.from(b)))" "$$GH_URL" /tmp/gh.tar.gz
              mkdir -p /home/node/.local/bin
              tar -xzf /tmp/gh.tar.gz -C /tmp
              cp "/tmp/gh_$${GH_VERSION}_linux_$${GH_ARCH}/bin/gh" /home/node/.local/bin/gh
              rm -rf /tmp/gh.tar.gz "/tmp/gh_$${GH_VERSION}_linux_$${GH_ARCH}"
            fi
          fi
        ) || true
        exec node dist/index.js gateway --bind lan --port 18789
    healthcheck:
      test: ["CMD", "node", "dist/docker-healthcheck.js"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

networks:
  caddy:
    external: true

volumes:
  openclaw-state:
  openclaw-auth-secrets:
  openclaw-local:
