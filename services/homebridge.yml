# homebridge — bridges non-HomeKit devices into Apple Home.
#
# HomeKit pairing and discovery are mDNS/Bonjour — link-local multicast — so a
# container on a docker bridge is invisible to an iPhone on the LAN. Hence
# `network_mode: host`. That is what makes the caddy label below need an
# explicit upstream, and what puts :8581 on the LAN — see both notes.
#
# Declared in ../komodo/syncs/services.toml.

services:
  homebridge:
    # No granular version tags exist upstream; `latest` is the documented
    # channel (ubuntu 24.04). Rollback means an image digest, not a tag.
    image: homebridge/homebridge:latest
    container_name: homebridge
    restart: unless-stopped
    # Required by the image's own docs, not a preference: mDNS needs the LAN
    # broadcast domain. The alternative is a macvlan network, which needs the
    # NIC name and a reserved IP.
    network_mode: host
    environment:
      - TZ=${TZ:-Asia/Kolkata}
      # The image runs its OWN avahi-daemon, and host networking puts it on the
      # host's :5353 — a straight conflict if Ubuntu's avahi-daemon is running
      # (`systemctl is-active avahi-daemon`). If it is, set this to 0 and mount
      # the host's dbus and avahi sockets so homebridge uses the host daemon:
      #   - /var/run/dbus:/var/run/dbus
      #   - /var/run/avahi-daemon/socket:/var/run/avahi-daemon/socket
      - ENABLE_AVAHI=1
    labels:
      caddy: http://homebridge.namanvashistha.com
      # An explicit address, not {{upstreams}}: a host-network container has no
      # IP on the caddy network. caddy-docker-proxy reads labels from every
      # container regardless of network — the membership check only gates
      # {{upstreams}} — so the route resolves from here.
      #
      # Literal, not a ${VAR}: this was a Komodo variable, and when the
      # reference went unresolved Komodo wrote HOST_ADDR=[[HOST_ADDR]] into the
      # stack's .env and never cleared it again — so the placeholder outlived
      # the commit that removed it, and caddy dropped the block as an
      # unparseable upstream. The address is the caddy bridge's gateway; re-read
      # it and edit here if that network is ever recreated:
      #   docker network inspect caddy -f '{{(index .IPAM.Config 0).Gateway}}'
      caddy.reverse_proxy: "172.18.0.1:8581"
    volumes:
      # config.json, the plugin list, and the HomeKit pairing keys. Wiping this
      # unpairs the bridge: every device vanishes from Apple Home and every
      # automation referencing them breaks.
      - homebridge-data:/homebridge

volumes:
  homebridge-data:
