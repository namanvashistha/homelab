# glance — the one page that shows the whole box, at homelab.namanvashistha.com.
#
# THIS ONE IS PUBLIC. Every other hostname on this box sits behind Cloudflare
# Access; this one is meant to be reachable without logging in, which takes an
# Access Bypass policy for homelab.namanvashistha.com in the Cloudflare
# dashboard. Nothing in this repo can do that — see ../README.md.
#
# Being public is why this file looks more paranoid than services/whoami.yml:
# a container that anyone on the internet can reach should not also be holding
# the keys to the host. See the socket proxy below.
#
# Chosen over Gatus because "is it up" was only half of what was wanted. Glance
# puts container state, uptime checks and links on a single page, and its
# config is one YAML file in this repo rather than state accumulated in a
# volume by clicking.
#
# Declared in ../komodo/syncs/services.toml.

services:
  # ---- the dashboard ----
  glance:
    image: glanceapp/glance:latest
    container_name: glance
    restart: unless-stopped
    # No `ports:`. Ingress is cloudflared -> caddy.
    expose:
      - "8080"
    volumes:
      # Relative bind mount of a file that lives in THIS repo — the one case
      # where relative is correct, because Komodo clones the repo to
      # /etc/komodo/stacks/glance/ and ./ resolves to exactly where it is.
      - ./glance-config.yaml:/app/config/glance.yml:ro
    # NOTE: no /var/run/docker.sock here, deliberately. See docker-socket-proxy.
    # NOTE: no host filesystem mount either. Glance's server-stats widget can
    # report host disk, but only if you mount the host root into the container —
    # and mounting / into a publicly reachable container means any file-read bug
    # in it reads bootstrap/.env. Disk is already covered properly: Komodo
    # alerts to Slack at 80% and 90% (see komodo/syncs/infra.toml), which is the
    # failure that has actually happened here.
    networks: [caddy, glance-internal]
    labels:
      # http:// scheme required — Caddy runs auto_https=off behind Cloudflare
      caddy: http://homelab.namanvashistha.com
      caddy.reverse_proxy: "{{upstreams 8080}}"
    healthcheck:
      # Glance serves GET /api/healthz. Image is alpine, so busybox wget is
      # there; -O /dev/null keeps the response out of the logs.
      test: ["CMD", "wget", "-qO", "/dev/null", "http://localhost:8080/api/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ---- read-only, scoped access to the docker API ----
  # The containers widget needs to ask the daemon what is running. Handing a
  # public-facing container /var/run/docker.sock would hand it root on the host:
  # anything that can talk to that socket can start a privileged container.
  #
  # Mounting the socket `:ro` does NOT help — read-only applies to the socket
  # FILE, not to the API calls made through it. The daemon does not care.
  #
  # This proxy is the actual fix. It allows exactly one API surface, CONTAINERS,
  # and denies the rest by default, so the worst a compromised glance can do is
  # list containers.
  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:latest
    container_name: glance-socket-proxy
    restart: unless-stopped
    environment:
      # The one thing glance needs.
      - CONTAINERS=1
      # Everything else off, spelled out rather than left to the image default,
      # because this list is the security boundary and it should be readable.
      - POST=0
      - EXEC=0
      - IMAGES=0
      - VOLUMES=0
      - NETWORKS=0
      - SERVICES=0
      - TASKS=0
      - SECRETS=0
      - CONFIGS=0
      - NODES=0
      - SWARM=0
      - SYSTEM=0
      - INFO=0
      - BUILD=0
      - COMMIT=0
      - PLUGINS=0
      - AUTH=0
      - DISTRIBUTION=0
      - SESSION=0
      - VERSION=0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    # NOT on the caddy network. Only glance can reach it, over the private
    # network below — an unauthenticated docker API must never be resolvable by
    # every other stack on this box.
    networks: [glance-internal]
    healthcheck:
      # The proxy only ever answers /containers; anything else is denied by
      # design, so probe the one path that should work.
      test: ["CMD-SHELL", "wget -qO /dev/null http://localhost:2375/containers/json || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    labels:
      komodo.skip:

networks:
  # Created by bootstrap/deploy.sh, shared by every stack on the box.
  caddy:
    external: true
  # Private to this stack: glance <-> proxy, nothing else.
  glance-internal:
