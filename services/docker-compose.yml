# Everything small and new goes here.
#
# One compose file, one Komodo stack (declared in services.toml beside it). Add
# a service, push, and it is running within ten minutes — no new stack, no new
# TOML block, no UI.
#
# WHAT BELONGS HERE
# Off-the-shelf things that run from a published image and have no repo of
# their own: a paste bin, a bookmark manager, an RSS reader. Anything you would
# otherwise create a repo for just to hold six lines of compose.
#
# WHAT DOES NOT
# Apps you actually develop. Those get their own repo and their own block in
# komodo/syncs/apps.toml, so a push to that repo redeploys only that app.
#
# THE TRADE-OFF, KNOWN AND ACCEPTED
# One compose file is one compose project. `compose up` runs across all of it,
# so a service with a bad image or a broken config fails the deploy for
# everything in this file. That is fine for small stateless things and wrong
# for anything you would miss. When something here grows up, move it to its own
# stack.
#
# TWO RULES
#   1. No `ports:`. Use `expose:` plus the two caddy labels — ingress is
#      cloudflared -> caddy, and a host port would bypass Cloudflare Access and
#      publish the service to the LAN.
#   2. Named volumes only, never `./data`. Komodo clones this repo to
#      /etc/komodo/stacks/services/, so a relative path anchors wherever the
#      clone landed rather than where you think.
#
# Secrets: add the variable in Komodo (Settings -> Variables), reference it in
# services.toml's `environment` as [[NAME]], and read it here as ${NAME}.

services:
  # ---- Example. Delete it once something real lives here. --------------
  # whoami:
  #   image: traefik/whoami
  #   container_name: whoami
  #   restart: unless-stopped
  #   expose:
  #     - "80"
  #   networks: [caddy]
  #   labels:
  #     # http:// required — Caddy runs auto_https=off behind Cloudflare
  #     caddy: http://whoami.namanvashistha.com
  #     caddy.reverse_proxy: "{{upstreams 80}}"
  # ----------------------------------------------------------------------

  # Compose refuses a file with no services, so this placeholder keeps the
  # stack deployable while the file is empty. Delete it once you add a real
  # service — it exits immediately and Komodo ignores it via `ignore_services`
  # in services.toml.
  placeholder:
    image: alpine:3.20
    container_name: services-placeholder
    command: ["true"]
    restart: "no"
    labels:
      komodo.skip:

networks:
  # Created by bootstrap/deploy.sh, shared by every stack on the box.
  caddy:
    external: true
