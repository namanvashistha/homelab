# Glance configuration. Mounted read-only at /app/config/glance.yml by
# glance.yml.
#
# NOTE THE EXTENSION: .yaml, not .yml. CI globs `services/*.yml` and runs
# `docker compose config` over every match, so naming this .yml would make CI
# try to validate a dashboard config as a compose file and fail.
#
# ---------------------------------------------------------------------------
# THIS PAGE IS PUBLIC. Everything below is world-readable.
# ---------------------------------------------------------------------------
# What that discloses, stated plainly so it is a decision and not an accident:
# every service running on this box, by name and image tag. Image tags are the
# interesting part to someone else — they say which versions you are on, which
# is the first thing anyone looks for. Nothing here is a credential, and none
# of it is reachable without going through Cloudflare Access anyway, but it is
# strictly more than a stranger knew before.
#
# To trim it: put `glance.hide: "true"` as a label on any container you would
# rather not list, or delete the docker-containers widget and keep only the
# monitor widget, which shows up/down without naming anything internal.

pages:
  - name: homelab
    columns:
      # ---- left: what is actually running ----
      - size: full
        widgets:
          # Auto-discovered from the docker API via the socket proxy. This is
          # the part that does not need maintaining: a new stack appears here
          # on its own, with no edit to this file.
          #
          # Per-container display is controlled by labels on the container
          # itself, which is the same pattern caddy already uses here:
          #   glance.name         display name
          #   glance.url          where the tile links to
          #   glance.description  one line under the name
          #   glance.icon         icon
          #   glance.hide         "true" to leave it off this page
          #   glance.parent       group under another container
          - type: docker-containers
            # tcp rather than a unix path: the proxy speaks HTTP on 2375. The
            # docs point at docker-socket-proxy for exactly this but do not
            # give a URL example, so this is the one line to check on first
            # run — if the widget comes up empty, that is why.
            sock-path: tcp://docker-socket-proxy:2375
            hide-by-default: false
            format-container-names: true

      # ---- right: is it reachable from outside ----
      - size: small
        widgets:
          # These go out to Cloudflare and back in through the tunnel, so they
          # test the whole path — tunnel, caddy, container — rather than just
          # whether a process is alive. A container can be `running` and still
          # be unreachable, which is precisely the failure this catches.
          #
          # komodo is deliberately absent: it sits behind Cloudflare Access, so
          # an unauthenticated check would only ever measure the login page.
          # text-to-image-bot too — it is a Telegram bot with no HTTP listener.
          # Both are covered by Komodo's own Slack alerts instead.
          - type: monitor
            cache: 1m
            title: services
            sites:
              - title: whoami
                url: https://whoami.namanvashistha.com
              - title: chess
                url: https://chess.namanvashistha.com
              - title: foodly
                url: https://foodly.namanvashistha.com
              - title: hyperbole
                url: https://hyperbole.namanvashistha.com
              - title: limedb
                url: https://limedb.namanvashistha.com
