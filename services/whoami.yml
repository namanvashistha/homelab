# whoami — traefik's tiny echo server. Answers with the request headers and the
# container's hostname and IP.
#
# Here as the worked example for this folder, and as a genuinely useful probe:
# when a new service is unreachable, hitting whoami tells you whether the
# tunnel -> caddy -> container path is intact, or whether the problem is the
# service itself. A couple of MB, idles at nothing.
#
# Declared in ../komodo/syncs/services.toml.

services:
  whoami:
    image: traefik/whoami
    # container_name: whoami
    restart: unless-stopped
    deploy:
      replicas: 10
    expose: ["80"]
    networks: [caddy]
    labels:
      caddy: http://whoami.namanvashistha.com
      caddy.reverse_proxy: "{{upstreams 80}}"
      caddy.reverse_proxy.lb_policy: round_robin   # default is random
    healthcheck:
      # The image is scratch-based: no shell, no wget, no curl. Its own binary
      # is the only thing that can run, and `--help`-style flags exit non-zero,
      # so there is nothing sane to probe with. Komodo reports container state
      # regardless; the caddy route is the real health signal here.
      disable: true

networks:
  # Created by bootstrap/deploy.sh, shared by every stack on the box.
  caddy:
    external: true
