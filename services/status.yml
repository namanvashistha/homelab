# status — redirects status.namanvashistha.com to the free-tier UptimeRobot
# public status page. Custom domains for status pages are a paid UptimeRobot
# feature; a reverse proxy was tried first but the page's JS makes hardcoded
# CORS-restricted calls straight to stats.uptimerobot.com, so only the shell
# rendered and live data never loaded. A redirect has no such problem — the
# browser just lands on UptimeRobot's own origin.
#
# The container does nothing itself; it only exists to carry the caddy
# labels caddy-docker-proxy reads off the Docker API. `sleep infinity` keeps
# it "running" (required for the labels to be picked up) at effectively zero
# cost.
#
# Pulled from AWS's public ECR mirror, not Docker Hub: `alpine:latest` hit
# Docker Hub's anonymous 429 rate limit on deploy. The ECR mirror carries the
# same official image with no such limit.
#
# Declared in ../komodo/syncs/services.toml.

services:
  status:
    image: public.ecr.aws/docker/library/alpine:latest
    container_name: status
    restart: unless-stopped
    command: ["sleep", "infinity"]
    networks: [caddy]
    labels:
      caddy: http://status.namanvashistha.com
      caddy.redir: https://stats.uptimerobot.com/o8pmpwXD1J 302
    healthcheck:
      disable: true

networks:
  caddy:
    external: true
