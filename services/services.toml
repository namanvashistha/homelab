# The one stack built from this folder.
#
# This file lives here rather than in komodo/syncs so that everything about
# adding a small service is in one directory: the compose beside its
# declaration. The sync's Resource Paths must therefore list `services` as well
# as `komodo/syncs` — a one-time setting on the sync in the UI.
#
# You should rarely need to touch this file. Adding a service means editing
# docker-compose.yml next to it; this block only changes when the stack itself
# needs different behaviour, or when a new secret has to be passed through.

[[stack]]
name = "services"
description = "Small off-the-shelf services with no repo of their own."
tags = ["app"]

[stack.config]
server = "Local"
git_provider = "github.com"
repo = "namanvashistha/homelab"
branch = "main"
# cd here before running compose, so the file below resolves and any relative
# path in it anchors to this directory.
run_directory = "services"
file_paths = ["docker-compose.yml"]

# Published images, nothing built from source. That makes this the one stack
# where the update flags are the right way round:
#   auto_pull        pull before deploying, so a redeploy actually gets the
#                    newer image rather than reusing a stale local one
#   poll_for_updates surface a newer digest in the UI and raise
#                    StackImageUpdateAvailable
#   auto_update      OFF. Unattended upgrades of whatever happens to be in here
#                    is how you find out at 3am that a `:latest` tag moved.
#                    Turn it on per-need once something proves stable — that is
#                    also what makes the native StackAutoUpdated alert fire.
run_build = false
auto_pull = true
poll_for_updates = true
auto_update = false
webhook_enabled = true

# The placeholder in the compose file runs `true` and exits, which would
# otherwise leave this stack reporting STOPPED in red forever. Delete both the
# service and this line once a real service lives here.
ignore_services = ["placeholder"]

# Secrets for anything in this folder go here, one line per variable, resolved
# from Settings -> Variables and written to a .env beside the compose file:
#
# environment = """
# SOMETHING_TOKEN=[[SOMETHING_TOKEN]]
# """
