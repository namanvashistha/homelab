# Catch broken config before Komodo tries to apply it.
#
# This exists because the failure mode is otherwise quiet: a typo in a sync
# file leaves the sync sitting in Failed in a UI nobody is looking at, and a
# broken compose file only surfaces when a deploy fails two minutes after a
# push. Both are cheap to catch here.

name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Dummy values for the `:?` required vars — this proves the file parses
      # and interpolates, not that the secrets are correct.
      - name: Validate compose files
        run: |
          # Only the compose files this repo owns. Projects keep theirs in
          # their own repo (see komodo/syncs/projects.toml), so they are
          # validated there, not here.
          #
          # nullglob so an empty services/ doesn't leave the literal pattern in
          # the loop and fail on a file called "services/*.yml".
          shopt -s nullglob
          for f in bootstrap/docker-compose.yml services/*.yml; do
            echo "--- $f"
            # Dummy values for every `:?` required var. This proves the file
            # parses and interpolates, not that the real secrets are correct.
            CF_TUNNEL_TOKEN=x \
            KOMODO_DB_PASSWORD=x \
            KOMODO_ADMIN_PASSWORD=x \
            KOMODO_JWT_SECRET=x \
            KOMODO_WEBHOOK_SECRET=x \
            docker compose -f "$f" config -q
          done

  syncs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate Komodo sync files
        run: |
          python3 - <<'PY'
          import pathlib, sys, tomllib

          # Each assertion encodes a mistake that actually broke the box once.
          errors = []
          # rglob: services/ is a subdirectory, and Komodo recurses too.
          toml_files = sorted(pathlib.Path("komodo/syncs").rglob("*.toml"))
          for path in toml_files:
              try:
                  doc = tomllib.loads(path.read_text())
              except tomllib.TOMLDecodeError as exc:
                  errors.append(f"{path}: {exc}")
                  continue

              # Declaring the sync inside its own files fails every run with
              # "ResourceSync busy", and a failed stage aborts the procedure.
              if doc.get("resource_sync"):
                  errors.append(
                      f"{path}: declares a [[resource_sync]] — it cannot update "
                      "itself; the sync is hand-created in the UI"
                  )

              for stack in doc.get("stack", []):
                  name = stack.get("name", "<unnamed>")
                  cfg = stack.get("config", {})
                  if not cfg.get("server"):
                      errors.append(f"{path}: stack '{name}' has no server")
                  if not (cfg.get("repo") or cfg.get("files_on_host")):
                      errors.append(f"{path}: stack '{name}' has no repo")
                  if cfg.get("run_build") and cfg.get("auto_pull", True):
                      errors.append(
                          f"{path}: stack '{name}' sets run_build with "
                          "auto_pull — compose pull fails on locally built images"
                      )

                  # Stacks sourced from THIS repo name a compose file that is in
                  # this checkout, so a typo is catchable here rather than as a
                  # failed deploy ten minutes after a push. Stacks pointing at
                  # another repo are unverifiable from here and skipped.
                  if cfg.get("repo", "").endswith("/homelab"):
                      run_dir = cfg.get("run_directory", "")
                      for rel in cfg.get("file_paths", []):
                          target = pathlib.Path(run_dir) / rel
                          if not target.is_file():
                              errors.append(
                                  f"{path}: stack '{name}' references {target}, "
                                  "which does not exist in this repo"
                              )

              for proc in doc.get("procedure", []):
                  # A disabled or unparsed schedule on the poller stops the
                  # whole GitOps loop, and no later commit can restart it.
                  if proc.get("name") == "poll-git-redeploy":
                      pcfg = proc.get("config", {})
                      if not pcfg.get("schedule_enabled", True):
                          errors.append(f"{path}: poll-git-redeploy schedule is disabled")
                      if not pcfg.get("schedule"):
                          errors.append(f"{path}: poll-git-redeploy has no schedule")

              print(f"{path}: ok "
                    f"({len(doc.get('stack', []))} stacks, "
                    f"{len(doc.get('procedure', []))} procedures)")

          if errors:
              print("\n".join(errors), file=sys.stderr)
              sys.exit(1)
          PY
