# Applies changes to the bootstrap stack — the one job Komodo cannot do
# directly.
#
# THE PROBLEM
# komodo-periphery is the process that runs `docker compose up`. A compose run
# that recreates Periphery kills the command mid-flight, and the same goes for
# Core. So Komodo cannot deploy the stack it is made of.
#
# THE TRICK
# It can deploy a DIFFERENT stack that does it. This one-shot lives in its own
# compose project, so when it recreates komodo-core and komodo-periphery,
# nothing is killing the process doing the work — this container is not part of
# what is being replaced.
#
# The sequence, on any commit to this repo:
#   1. Komodo's poll-git-redeploy procedure notices the new hash
#   2. Periphery runs `compose up -d` here, which starts this container and
#      returns immediately (the container is detached, and exits on its own)
#   3. This container pulls the repo and applies bootstrap/docker-compose.yml,
#      recreating Core and Periphery if they changed
#
# Expect Komodo to log that deploy as failed or hanging WHEN the bootstrap
# services actually change — Periphery is torn down before it can report the
# result. The work still completes; the container is running independently by
# then. On the far more common no-op run, nothing restarts and the record is
# clean.
#
# RECOVERY: if a bad commit breaks the bootstrap stack, nothing here can fix
# it — Komodo is part of what broke. SSH in and run bootstrap/deploy.sh by hand.
#
# Komodo will show this stack STOPPED once the container exits, which is the
# intended end state, not a failure. `ignore_services` and `send_alerts = false`
# on the stack in ../komodo/syncs/infra.toml stop that from reading as red.

services:
  bootstrap-apply:
    # Ships git, the docker CLI and the compose plugin — everything needed and
    # nothing else. Alpine-based, a few MB, exits in seconds.
    image: docker:cli
    container_name: homelab-self-update
    # Runs once and exits. Never restart: a restart loop here would reapply the
    # bootstrap stack every few seconds.
    restart: "no"
    volumes:
      # Talks to the HOST daemon: every path in bootstrap/docker-compose.yml is
      # interpreted by the daemon, not by this container. That file therefore
      # uses only absolute host paths (/var/run/docker.sock, /etc/komodo) —
      # a relative bind mount there would resolve against this container's
      # filesystem and silently create the wrong directory on the host.
      - /var/run/docker.sock:/var/run/docker.sock
      # The bootstrap checkout, including its gitignored .env. Absolute host
      # path, and the one thing here that assumes where the repo lives.
      - ${HOMELAB_DIR:-/root/homelab}:/homelab
    working_dir: /homelab
    command:
      - sh
      - -ceu
      - |
        echo "pulling $(git -C /homelab rev-parse --short HEAD) -> origin"
        git pull --ff-only
        echo "applying bootstrap stack"
        docker compose \
          --env-file bootstrap/.env \
          -f bootstrap/docker-compose.yml \
          up -d --remove-orphans
        echo "bootstrap applied: $(git rev-parse --short HEAD)"
    labels:
      # Never let StopAllContainers catch this mid-apply.
      komodo.skip:
