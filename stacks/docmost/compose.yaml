# Docmost: self-hosted collaborative wiki, at docs.namanvashistha.com.
#
# Three containers. Only the app is reverse-proxied; Postgres and Redis sit on
# an internal network with no route to caddy and no published ports.
#
# Secrets come from Komodo (Settings -> Variables), written to a .env beside
# this file at deploy time. The previous version of this stack had APP_SECRET
# and the Postgres password committed in plain text — this repo is public, so
# they are references now, not values. Create both before deploying:
#
#   DOCMOST_APP_SECRET     openssl rand -hex 32
#   DOCMOST_DB_PASSWORD    any strong string
#
# Changing DOCMOST_DB_PASSWORD after first boot does NOT change the Postgres
# user — the password is only read when the data volume is initialised. It just
# locks the app out until you set it back, or drop the docmost-db volume.

services:
  docmost:
    # Unpinned upstream, deliberately paired with poll_for_updates on the stack
    # (not auto_update): a wiki with a database should not migrate its schema
    # unattended. You get told, you decide.
    image: docmost/docmost:latest
    container_name: docmost
    restart: unless-stopped
    depends_on:
      - docmost-db
      - docmost-redis
    environment:
      # Docmost builds absolute links from this — invite emails, share links.
      # https, because Cloudflare terminates TLS even though this speaks plain
      # HTTP to caddy.
      - APP_URL=https://docs.namanvashistha.com
      - APP_SECRET=${DOCMOST_APP_SECRET:?set DOCMOST_APP_SECRET in Komodo Variables}
      - DATABASE_URL=postgresql://docmost:${DOCMOST_DB_PASSWORD:?set DOCMOST_DB_PASSWORD in Komodo Variables}@docmost-db:5432/docmost?schema=public
      - REDIS_URL=redis://docmost-redis:6379
      - TZ=${TZ:-Asia/Kolkata}
    volumes:
      # Attachments and avatars. The documents themselves live in Postgres, so
      # a backup needs both this volume and docmost-db.
      - docmost-storage:/app/data/storage
    expose:
      - "3000"
    # Both networks: caddy to be routed, docmost to reach the database.
    networks: [caddy, docmost]
    labels:
      # http:// scheme required — Caddy runs auto_https=off behind Cloudflare
      caddy: http://docs.namanvashistha.com
      caddy.reverse_proxy: "{{upstreams 3000}}"

  docmost-db:
    image: postgres:16-alpine
    container_name: docmost-db
    restart: unless-stopped
    environment:
      - POSTGRES_DB=docmost
      - POSTGRES_USER=docmost
      - POSTGRES_PASSWORD=${DOCMOST_DB_PASSWORD:?set DOCMOST_DB_PASSWORD in Komodo Variables}
      - TZ=${TZ:-Asia/Kolkata}
    volumes:
      - docmost-db:/var/lib/postgresql/data
    # Internal only. No caddy network, no ports — nothing outside this stack
    # can reach it.
    networks: [docmost]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docmost -d docmost"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  docmost-redis:
    image: redis:7-alpine
    container_name: docmost-redis
    restart: unless-stopped
    volumes:
      - docmost-redis:/data
    networks: [docmost]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  # Created by bootstrap/deploy.sh, shared by every stack on the box.
  caddy:
    external: true
  # Private to this stack, created by compose.
  docmost:

volumes:
  # Documents. Losing this loses the wiki — docmost-storage only holds uploads.
  docmost-db:
  docmost-storage:
  docmost-redis:
