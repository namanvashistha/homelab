# Infrastructure resources: the sync itself, the server, the redeploy poller,
# and the stacks that are infrastructure rather than applications.
#
# Applications live in apps.toml. The split is by lifecycle, not by size —
# things in here change when the platform changes; things in apps.toml change
# when an app ships.
#
# See ../../README.md for how this file gets applied and how to add a service.

# ---------------------------------------------------------------------------
# The sync resource, declaring itself.
#
# One ResourceSync must be created by hand in the UI the first time (Komodo
# never discovers sync files on its own). Name it exactly `homelab` and point
# it at this directory; from then on it manages itself through git.
# ---------------------------------------------------------------------------

[[resource_sync]]
name = "homelab"
description = "Applies komodo/syncs from the homelab repo."

[resource_sync.config]
git_provider = "github.com"
repo = "namanvashistha/homelab"
branch = "main"
# A directory: new .toml files dropped in here are picked up without editing
# this resource.
resource_path = ["komodo/syncs"]
# OFF, deliberately. Komodo's delete mode is not scoped to the resource types
# these files mention — it walks EVERY type and removes anything not declared
# (bin/core/src/sync/execute.rs). Enabling it today would destroy the two
# Procedures Core creates on first boot ("Backup Core Database", "Global Auto
# Update"). Turn it on only once every resource on the instance is declared
# here; the payoff is that deleting a block then really does tear the service
# down, with no silent drift.
delete = false
# `managed` would let Komodo WRITE resources back into these files from the UI.
# Off: git is the input, not the output.
managed = false
include_resources = true
# Variables and secrets stay in the database. This repo is public.
include_variables = false
include_user_groups = false
webhook_enabled = true

# ---------------------------------------------------------------------------
# The server every stack is deployed to.
#
# Core also creates this on startup from KOMODO_FIRST_SERVER_NAME, but only
# when NO server exists at all (bin/core/src/startup.rs early-returns the moment
# it finds one). That makes the env var a bootstrap convenience and this block
# the source of truth: delete the server in the UI and nothing brings it back
# until Core restarts — unless it is declared here.
#
# The name must match KOMODO_FIRST_SERVER_NAME and PERIPHERY_CONNECT_AS, both
# fed by ${KOMODO_SERVER_NAME:-Local} in bootstrap/docker-compose.yml.
#
# No `address`: empty means Periphery dials Core (ws://komodo-core:9120),
# rather than Core reaching out to an agent.
# ---------------------------------------------------------------------------

[[server]]
name = "Local"
description = "The box. Periphery runs beside Core in the bootstrap stack."

[server.config]
enabled = true
send_unreachable_alerts = true
send_cpu_alerts = true
send_mem_alerts = true
send_disk_alerts = true

# ---------------------------------------------------------------------------
# Redeploy on commit, by polling.
#
# Komodo's native path is a GitHub webhook, which here has to cross Cloudflare
# Access — GitHub cannot log in, so it would need a Bypass policy on
# /listener/*. This procedure avoids that entirely: no webhook, no Access
# exception, no inbound anything.
#
# `DeployStackIfChanged` fetches each repo's latest commit and compares it with
# what is deployed, redeploying only on a real difference — so a tighter
# schedule costs a git fetch per stack, not a rebuild. The batch form takes a
# pattern, so stacks added later are covered without touching this.
#
# Cron is SIX fields: (second, minute, hour, day, month, day-of-week).
# `0 */10 * * * *` is every ten minutes, not every ten seconds. Drop to
# `0 */2 * * * *` if the wait after a push starts to annoy.
# ---------------------------------------------------------------------------

[[procedure]]
name = "poll-git-redeploy"
description = "Every 10 min: apply this repo's declarations, then redeploy any stack whose repo has new commits."

[procedure.config]
schedule_format = "Cron"
schedule = "0 */10 * * * *"
schedule_enabled = true
schedule_timezone = "Asia/Kolkata"
# Off on purpose: this runs 144 times a day and an alert per run is noise.
# Failures still alert via failure_alert.
schedule_alert = false
failure_alert = true

# Stage 1: apply this repo's declarations.
#
# A sync does NOT self-apply. Left alone it notices new commits, computes a
# diff, parks in `Pending` and waits for someone to press Execute — which means
# a stack added to apps.toml would sit unapplied until somebody opened the UI.
# `RunSync` is that Execute, on a schedule.
#
# Stages run in order, so declarations land before the deploy stage below:
# a stack added in the same commit exists by the time anything tries to
# redeploy it.
#
# Note it may update this very procedure mid-run. Harmless — the config was
# read when the run started; edits take effect on the next firing.
[[procedure.config.stage]]
name = "Apply declarations"
enabled = true

[[procedure.config.stage.execution]]
enabled = true

[procedure.config.stage.execution.execution]
type = "RunSync"
params.sync = "homelab"

# Stage 2: redeploy anything whose own repo moved.
[[procedure.config.stage]]
name = "Redeploy changed stacks"
enabled = true

[[procedure.config.stage.execution]]
enabled = true

[procedure.config.stage.execution.execution]
type = "BatchDeployStackIfChanged"
# Every stack — and `self-update` below is deliberately one of them. It is
# sourced from THIS repo, so any commit here changes its hash and redeploys it,
# which is exactly what applies a bootstrap change. A README-only commit runs it
# too; that costs a git pull and a no-op `compose up`.
params.pattern = "*"

# ---------------------------------------------------------------------------
# The stack that updates the bootstrap stack.
#
# This is what closes the last manual loop. Komodo cannot deploy the containers
# it runs inside — Periphery would kill its own compose command — so it deploys
# this instead, and this does the work from outside the blast radius. See
# ../../stacks/self-update.yml for the full mechanism.
#
# Because it is sourced from this repo, the poller above redeploys it whenever
# anything here changes, meaning bootstrap edits land within ten minutes with
# no systemd timer, no cron, and nothing outside Komodo.
#
# To force an apply without a commit: Stacks -> self-update -> Deploy.
# ---------------------------------------------------------------------------

[[stack]]
name = "self-update"
description = "One-shot that pulls this repo and applies the bootstrap stack."
tags = ["infra"]

[stack.config]
server = "Local"
git_provider = "github.com"
repo = "namanvashistha/homelab"
branch = "main"
run_directory = "stacks"
file_paths = ["self-update.yml"]
# docker:cli is a registry image, so pulling is right and there is nothing to
# build. Update polling is off: this image is a stable tool, not a service, and
# an unattended bump of the thing that rewrites the bootstrap stack is the last
# place to want surprises.
auto_pull = true
run_build = false
poll_for_updates = false
auto_update = false
webhook_enabled = true
# This stack is SUPPOSED to end up with nothing running. Without this, Komodo
# reports it STOPPED in red the moment the one-shot exits 0 — upstream's own
# words for the flag: "an init service might be exited, but the stack should be
# healthy. This init service should be in `ignore_services`."
ignore_services = ["bootstrap-apply"]
# And no StackStateChange alerts: a one-shot finishing its work is not an
# incident, and this one finishes on every deploy. Real failures surface in the
# container log and in the procedure's own failure_alert.
send_alerts = false
# Where the bootstrap checkout lives on the host — the one path this design
# assumes. Matches BASE_DIR in bootstrap/deploy.sh, which defaults to
# $HOME/homelab (so /root/homelab when deploy.sh runs as root).
environment = """
HOMELAB_DIR=/root/homelab
"""
