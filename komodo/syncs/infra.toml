# The server, and the procedure that keeps everything in sync with git.
# Apps live in apps.toml.
#
# ALERTS: this file decides both what gets raised and where it goes. The Slack
# webhook URL is the one part that stays out of git — it is a Komodo Variable,
# referenced below as [[SLACK_WEBHOOK_URL]]. Create it under
# Settings -> Variables, marked secret, before the alerter is any use.
#
# Note: the sync resource itself is NOT declared here. A sync can't update
# itself — it holds a lock on its own resource while running, so it fails with
# "ResourceSync busy" and the whole run aborts. It is created once in the UI:
#
#   Name           homelab
#   Repo           namanvashistha/homelab   (github.com, branch main)
#   Resource path  komodo/syncs
#   Delete         OFF
#   Managed        OFF

# The server everything deploys to. Core also creates this on first boot from
# KOMODO_FIRST_SERVER_NAME, but only when no server exists at all — declaring
# it here means it comes back if it's ever deleted.
# No address: empty means Periphery dials Core, which is how they're wired.
[[server]]
name = "Local"
description = "The box."

# Which alerts this server raises. Where they go is the `slack` alerter at the
# bottom of this file — without an enabled alerter these are computed and
# silently dropped.
[server.config]
enabled = true

# The one that matters: the box is unreachable, or Periphery stopped
# answering. Everything else is a detail by comparison.
send_unreachable_alerts = true

# ON since builds moved to CI. They were off because six stacks compiled here
# and every deploy pegged the CPU. 1-core LXC, so one busy container is the
# whole machine — if these flap, raise the thresholds rather than disabling.
send_cpu_alerts = true
cpu_warning = 80.0
cpu_critical = 90.0

# OFF: the graph is pinned at 0.00 GB, so a threshold cannot fire. Two scope
# mismatches, either one sufficient (bin/periphery/src/stats/mem.rs computes
# used = (MemTotal - MemAvailable) - zfs_arc, saturating):
#
#   1. lxcfs virtualises /proc/meminfo but not arcstats, so a 1.55 GiB HOST ARC
#      is subtracted from a 485 MiB GUEST figure. Floors at zero.
#   2. lxcfs answers per reading process's cgroup, so Periphery in a container
#      measures itself: 3.3 MiB used, not 485 MiB. Wrong even if 1 were fixed.
#
# Masking arcstats is impossible — runc refuses to create a mountpoint under
# /proc, and Periphery then fails to start (see bootstrap/docker-compose.yml).
# Fixes that would work: native Periphery via systemd plus
# InaccessiblePaths=/proc/spl, or a VM. Neither earns its cost here.
#
# Filed with a patch: https://github.com/moghtech/komodo/issues/1139
# Meanwhile: per-container memory in Komodo IS correct (cgroup stats, not
# /proc), and the server total is in Proxmox.
send_mem_alerts = false

# Disk alerts ON, and tightened. This is the failure mode that has actually
# happened here: 37 GB of dead images and build cache. Six source-building
# stacks means every deploy leaves a dangling image behind, so disk creeps up
# on its own with nobody doing anything wrong.
# Warning earlier than the 75/95 defaults — on a homelab disk, 80% is the point
# where you want a nudge, not a scramble.
send_disk_alerts = true
disk_warning = 80.0
disk_critical = 90.0

# Fires when Core and Periphery are on different versions — which is exactly
# what a half-applied bootstrap update looks like. Cheap, and it catches a
# genuinely confusing state.
send_version_mismatch_alerts = true

# Every 10 minutes:
#   1. apply this repo's TOML  (a sync only goes Pending on its own; RunSync
#      is the Execute button, on a schedule)
#   2. redeploy any stack whose own repo has new commits
# Stages run in order, so a stack added to apps.toml is created before step 2
# tries to deploy it.
#
# Cron is SIX fields: second minute hour day month day-of-week.
[[procedure]]
name = "sync-and-deploy"
description = "Every 10 min: apply the TOML, then redeploy stacks whose compose changed."

[procedure.config]
schedule_format = "Cron"
schedule = "0 */10 * * * *"
schedule_enabled = true
schedule_timezone = "Asia/Kolkata"
schedule_alert = false
failure_alert = true
webhook_enabled = false

[[procedure.config.stage]]
name = "Apply declarations"
enabled = true

[[procedure.config.stage.execution]]
enabled = true

[procedure.config.stage.execution.execution]
type = "RunSync"
params.sync = "homelab"

# There is no second stage. BatchDeployStackIfChanged used to live here, but
# `deploy = true` on each stack makes RunSync do the same work: it diffs
# deployed_contents against remote_contents and redeploys on a difference
# (bin/core/src/sync/deploy.rs), and additionally catches config changes the
# batch execution never did.
#
# Consequence of `deploy = true` worth knowing: any stack not in Running state
# is redeployed, so stopping one in the UI does not stick — it returns within
# ten minutes. Set `deploy = false` on that stack to stop it for real.
# Komodo creates this procedure on install, scheduled DAILY at 03:00, and it is
# the only thing that acts on a stack's auto_update flag — that flag is not a
# background poll. Daily meant a push sat undeployed until 3am, so it is
# declared here to put its schedule in git and run it every ten minutes.
#
# Same name as the one Komodo created, so the sync adopts it rather than making
# a second one.
#
# Offset five minutes from sync-and-deploy: this box has one core, and pulling
# images while the sync runs is the one way to make both slow.
[[procedure]]
name = "Global Auto Update"
description = "Every 10 min: pull newer image digests, redeploy stacks with auto_update."
tags = ["system"]

[procedure.config]
schedule_format = "Cron"
schedule = "0 5,15,25,35,45,55 * * * *"
schedule_enabled = true
schedule_timezone = "Asia/Kolkata"
schedule_alert = false
failure_alert = true
webhook_enabled = false

[[procedure.config.stage]]
name = "Pull and redeploy"
enabled = true

[[procedure.config.stage.execution]]
enabled = true

[procedure.config.stage.execution.execution]
type = "GlobalAutoUpdate"
params = {}

# ---------------------------------------------------------------------------
# Where alerts go.
#
# The webhook URL is interpolated at SEND time, not at sync time — Core resolves
# [[NAME]] against Variables & Secrets every time it posts
# (bin/core/src/alert/slack.rs calls interpolate_string on the url before
# constructing the client). So the secret never touches this repo, and rotating
# it is a Variables edit with no redeploy.
#
# Prerequisite: create SLACK_WEBHOOK_URL under Settings -> Variables, marked
# secret, holding the incoming-webhook URL from your Slack app. Until it exists
# the alerter posts to the literal string and fails.
#
# Test it from the alerter's page — that fires the `Test` alert type, which is
# deliberately in the list below so the test actually arrives.
# ---------------------------------------------------------------------------

[[alerter]]
name = "slack"
description = "Slack Alerts."

[alerter.config]
enabled = true

# Empty = NO FILTER, deliberately. bin/core/src/alert/mod.rs short-circuits on
# is_empty, so everything raised is forwarded, including types added by future
# releases.
#
# This was a whitelist guarding against one thing, ScheduleRun, which is only
# raised when a schedule sets schedule_alert = true (bin/core/src/schedule.rs).
# sync-and-deploy sets it false, so the list excluded an alert nobody produced.
#
# A whitelist fails silently and in the wrong direction: enabling CPU alerts did
# nothing in Slack for a while because ServerCpu was missing here — Core raised
# it, the UI showed it, the alerter dropped it. THIS KEY GATES DELIVERY ONLY.
# To actually turn something off, use send_*_alerts in [server.config] above,
# which stops it being raised.
#
# Test bypasses the filter entirely, so the Test button works regardless.
#
# ORDERING: must come BEFORE [alerter.config.endpoint] — TOML assigns bare keys
# to the most recent table header.
alert_types = []

[alerter.config.endpoint]
type = "Slack"
params.url = "[[SLACK_WEBHOOK_URL]]"
