# The server, and the procedure that keeps everything in sync with git.
# Apps live in apps.toml.
#
# ALERTS: this file decides both what gets raised and where it goes. The Slack
# webhook URL is the one part that stays out of git — it is a Komodo Variable,
# referenced below as [[SLACK_WEBHOOK_URL]]. Create it under
# Settings -> Variables, marked secret, before the alerter is any use.
#
# Note: the sync resource itself is NOT declared here. A sync can't update
# itself — it holds a lock on its own resource while running, so it fails with
# "ResourceSync busy" and the whole run aborts. It is created once in the UI:
#
#   Name           homelab
#   Repo           namanvashistha/homelab   (github.com, branch main)
#   Resource path  komodo/syncs
#   Delete         OFF
#   Managed        OFF

# The server everything deploys to. Core also creates this on first boot from
# KOMODO_FIRST_SERVER_NAME, but only when no server exists at all — declaring
# it here means it comes back if it's ever deleted.
# No address: empty means Periphery dials Core, which is how they're wired.
[[server]]
name = "Local"
description = "The box."

# Which alerts this server raises. Where they go is the `slack` alerter at the
# bottom of this file — without an enabled alerter these are computed and
# silently dropped.
[server.config]
enabled = true

# The one that matters: the box is unreachable, or Periphery stopped
# answering. Everything else is a detail by comparison.
send_unreachable_alerts = true

# CPU alerts OFF. Six stacks build from source on this host — chess in Go,
# limedb five containers from one Dockerfile, salt.md a Go binary plus web
# assets. Every deploy pegs the CPU for minutes at a time. At the default 90%
# warning this would page on routine work, and an alert you learn to ignore is
# worse than no alert.
send_cpu_alerts = false

# Memory alerts OFF, because they cannot fire. This host runs ZFS, and
# Periphery computes used memory as `(total - MemAvailable) - zfs_arc`
# (bin/periphery/src/stats/mem.rs). On this kernel the ARC is already counted
# in MemAvailable, so the subtraction happens twice, saturates at zero, and the
# Memory graph reads 0.00 GB no matter the real usage. A threshold against a
# number pinned at zero never triggers. Turn this back on if that upstream bug
# is fixed; until then it is false advertising.
send_mem_alerts = false

# Disk alerts ON, and tightened. This is the failure mode that has actually
# happened here: 37 GB of dead images and build cache. Six source-building
# stacks means every deploy leaves a dangling image behind, so disk creeps up
# on its own with nobody doing anything wrong.
# Warning earlier than the 75/95 defaults — on a homelab disk, 80% is the point
# where you want a nudge, not a scramble.
send_disk_alerts = true
disk_warning = 80.0
disk_critical = 90.0

# Fires when Core and Periphery are on different versions — which is exactly
# what a half-applied bootstrap update looks like. Cheap, and it catches a
# genuinely confusing state.
send_version_mismatch_alerts = true

# Every 10 minutes:
#   1. apply this repo's TOML  (a sync only goes Pending on its own; RunSync
#      is the Execute button, on a schedule)
#   2. redeploy any stack whose own repo has new commits
# Stages run in order, so a stack added to apps.toml is created before step 2
# tries to deploy it.
#
# Cron is SIX fields: second minute hour day month day-of-week.
[[procedure]]
name = "poll-git-redeploy"
description = "Every 10 min: apply the TOML, then redeploy stacks with new commits."

[procedure.config]
schedule_format = "Cron"
schedule = "0 */10 * * * *"
schedule_enabled = true
schedule_timezone = "Asia/Kolkata"
schedule_alert = false
failure_alert = true

[[procedure.config.stage]]
name = "Apply declarations"
enabled = true

[[procedure.config.stage.execution]]
enabled = true

[procedure.config.stage.execution.execution]
type = "RunSync"
params.sync = "homelab"

[[procedure.config.stage]]
name = "Redeploy changed stacks"
enabled = true

[[procedure.config.stage.execution]]
enabled = true

[procedure.config.stage.execution.execution]
type = "BatchDeployStackIfChanged"
params.pattern = "*"

# ---------------------------------------------------------------------------
# Where alerts go.
#
# The webhook URL is interpolated at SEND time, not at sync time — Core resolves
# [[NAME]] against Variables & Secrets every time it posts
# (bin/core/src/alert/slack.rs calls interpolate_string on the url before
# constructing the client). So the secret never touches this repo, and rotating
# it is a Variables edit with no redeploy.
#
# Prerequisite: create SLACK_WEBHOOK_URL under Settings -> Variables, marked
# secret, holding the incoming-webhook URL from your Slack app. Until it exists
# the alerter posts to the literal string and fails.
#
# Test it from the alerter's page — that fires the `Test` alert type, which is
# deliberately in the list below so the test actually arrives.
# ---------------------------------------------------------------------------

[[alerter]]
name = "slack"
description = "Alerts to Slack."

[alerter.config]
enabled = true

# Empty would forward EVERYTHING, including a message on every scheduled run.
# This list is the set worth interrupting someone for:
#
#   ServerUnreachable      the box or Periphery is gone — the one that matters
#   ServerDisk             80% warn / 90% critical, set on the server above.
#                          The failure that has actually happened here: 37 GB
#                          of dead images and build cache.
#   StackStateChange       an app went down, unhealthy, or came back
#   ProcedureFailed        the poller broke, so git and reality have stopped
#                          converging. Otherwise entirely silent.
#   ResourceSyncPendingUpdates
#                          the sync computed a diff it could not apply — the
#                          shape of the "ResourceSync busy" failure that ran
#                          red for hours unnoticed
#   ServerVersionMismatch  Core and Periphery on different versions, i.e. a
#                          half-applied bootstrap update
#   BuildFailed            no-op until Builds are in use; free to leave on
#   Test                   so the Test button proves the whole path
#
# Not here, on purpose: ServerCpu and ServerMem, which the server above does
# not raise anyway — see the reasoning there.
#
# NOTE ON ORDERING: this key must come BEFORE [alerter.config.endpoint]. TOML
# assigns bare keys to the most recent table header, so putting it after would
# silently make it endpoint.alert_types, which Komodo ignores.
alert_types = [
  "ServerUnreachable",
  "ServerDisk",
  "StackStateChange",
  "ProcedureFailed",
  "ResourceSyncPendingUpdates",
  "ServerVersionMismatch",
  "BuildFailed",
  "Test",
]

[alerter.config.endpoint]
type = "Slack"
params.url = "[[SLACK_WEBHOOK_URL]]"
