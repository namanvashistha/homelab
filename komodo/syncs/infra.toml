# The server, and the procedure that keeps everything in sync with git.
# Apps live in apps.toml.
#
# ALERTS: this file decides both what gets raised and where it goes. The Slack
# webhook URL is the one part that stays out of git — it is a Komodo Variable,
# referenced below as [[SLACK_WEBHOOK_URL]]. Create it under
# Settings -> Variables, marked secret, before the alerter is any use.
#
# Note: the sync resource itself is NOT declared here. A sync can't update
# itself — it holds a lock on its own resource while running, so it fails with
# "ResourceSync busy" and the whole run aborts. It is created once in the UI:
#
#   Name           homelab
#   Repo           namanvashistha/homelab   (github.com, branch main)
#   Resource path  komodo/syncs
#   Delete         OFF
#   Managed        OFF

# The server everything deploys to. Core also creates this on first boot from
# KOMODO_FIRST_SERVER_NAME, but only when no server exists at all — declaring
# it here means it comes back if it's ever deleted.
# No address: empty means Periphery dials Core, which is how they're wired.
[[server]]
name = "Local"
description = "The box."

# Which alerts this server raises. Where they go is the `slack` alerter at the
# bottom of this file — without an enabled alerter these are computed and
# silently dropped.
[server.config]
enabled = true

# The one that matters: the box is unreachable, or Periphery stopped
# answering. Everything else is a detail by comparison.
send_unreachable_alerts = true

# CPU alerts ON, as of the move to ghcr.
#
# These were off for a good reason that has stopped applying: six stacks used
# to build from source on this host, so every deploy pegged the CPU for minutes
# and would have paged on entirely routine work. Builds happen in each app
# repo's CI now and this box only pulls, so sustained high CPU means something
# is actually wrong rather than something is being compiled.
#
# Worth watching on this host specifically: it is a 1-core LXC, so a single
# busy container is 100% of the machine. If these turn out to flap, raise the
# thresholds rather than switching them off — the signal is real here, it is
# the ceiling that is low.
send_cpu_alerts = true
cpu_warning = 80.0
cpu_critical = 90.0

# Memory alerts OFF, permanently, until upstream changes. The Memory graph
# reads 0.00 GB and a threshold against a number pinned at zero cannot fire, so
# enabling these would be theatre. Diagnosed and measured — TWO separate scope
# mismatches, either of which alone is enough to pin it at zero.
#
# bin/periphery/src/stats/mem.rs:
#   used = (MemTotal - MemAvailable) - zfs_arc      [saturating_sub]
# with zfs_arc read unconditionally from /proc/spl/kstat/zfs/arcstats.
#
# 1. THE ARC IS HOST-SCOPED, THE TOTALS ARE GUEST-SCOPED.
#    lxcfs virtualises /proc/meminfo, arcstats it does not. Measured here:
#      LXC:  MemTotal 1048576 kB   MemAvailable 551332 kB   -> used 485 MiB
#      ARC:  1667716264 B = 1.55 GiB, i.e. larger than the entire guest
#    485 MiB - 1.55 GiB saturates to 0. No guest smaller than the host's ARC
#    can ever report anything else.
#
# 2. IN DOCKER, LXCFS REPORTS PERIPHERY'S OWN CGROUP.
#    lxcfs answers according to the READING PROCESS's cgroup, so Periphery in a
#    container sees itself, not the box. Same instant, inside the container:
#      MemTotal 1048576 kB (right)   MemAvailable 1045223 kB (its own 66 MiB)
#    That makes used 3.3 MiB rather than 485 MiB — still wrong even with the
#    ARC fixed.
#
# WHAT DOES NOT WORK: masking arcstats with a bind mount. runc refuses to
# create a mountpoint under /proc and Periphery then fails to start, taking
# Komodo's ability to deploy with it. See bootstrap/docker-compose.yml.
#
# WHAT WOULD WORK, neither of which is worth it here:
#   - Periphery natively via systemd (fixes 2) plus InaccessiblePaths=/proc/spl
#     on the unit (fixes 1). Costs a bootstrap refactor and migrating the
#     Core<->Periphery keypair out of a docker volume, which breaks trust if
#     fumbled.
#   - A VM instead of an LXC, where /proc is real and neither bug exists. Costs
#     150-250 MiB of guest kernel out of 1 GiB.
#
# Filed upstream with the measurements and a suggested patch (ignore the ARC
# when it exceeds MemTotal, since an ARC bigger than the machine cannot be
# inside it):
#   https://github.com/moghtech/komodo/issues/1139
#
# UNTIL THEN, where to actually look:
#   - per-container memory in Komodo is CORRECT. It comes from the Docker API's
#     cgroup stats and never touches /proc/meminfo. More useful than the
#     aggregate anyway, since it says which container is responsible.
#   - the server total is in the Proxmox UI, which measures this guest from the
#     outside and is always right.
send_mem_alerts = false

# Disk alerts ON, and tightened. This is the failure mode that has actually
# happened here: 37 GB of dead images and build cache. Six source-building
# stacks means every deploy leaves a dangling image behind, so disk creeps up
# on its own with nobody doing anything wrong.
# Warning earlier than the 75/95 defaults — on a homelab disk, 80% is the point
# where you want a nudge, not a scramble.
send_disk_alerts = true
disk_warning = 80.0
disk_critical = 90.0

# Fires when Core and Periphery are on different versions — which is exactly
# what a half-applied bootstrap update looks like. Cheap, and it catches a
# genuinely confusing state.
send_version_mismatch_alerts = true

# Every 10 minutes:
#   1. apply this repo's TOML  (a sync only goes Pending on its own; RunSync
#      is the Execute button, on a schedule)
#   2. redeploy any stack whose own repo has new commits
# Stages run in order, so a stack added to apps.toml is created before step 2
# tries to deploy it.
#
# Cron is SIX fields: second minute hour day month day-of-week.
[[procedure]]
name = "poll-git-redeploy"
description = "Every 10 min: apply the TOML, then redeploy stacks with new commits."

[procedure.config]
schedule_format = "Cron"
schedule = "0 */10 * * * *"
schedule_enabled = true
schedule_timezone = "Asia/Kolkata"
schedule_alert = false
failure_alert = true

[[procedure.config.stage]]
name = "Apply declarations"
enabled = true

[[procedure.config.stage.execution]]
enabled = true

[procedure.config.stage.execution.execution]
type = "RunSync"
params.sync = "homelab"

# Stage 2: redeploy anything whose own repo moved.
#
# This was briefly a TypeScript Action that reported each deploy to Slack,
# because nothing in Komodo announces "a deploy happened" for a git-driven
# redeploy — StackStateChange is explicitly skipped while a stack is deploying
# (bin/core/src/monitor/alert/stack.rs). Forty lines of script for a
# notification was the wrong trade; `git log` has it if it is ever wanted.
#
# The native answer is StackAutoUpdated, which fires when Komodo redeploys a
# stack because a new IMAGE appeared. It is whitelisted on the alerter below
# and will start arriving on its own once these stacks pull from ghcr.io
# instead of building from source.
[[procedure.config.stage]]
name = "Redeploy changed stacks"
enabled = true

[[procedure.config.stage.execution]]
enabled = true

[procedure.config.stage.execution.execution]
type = "BatchDeployStackIfChanged"
params.pattern = "*"

# ---------------------------------------------------------------------------
# Where alerts go.
#
# The webhook URL is interpolated at SEND time, not at sync time — Core resolves
# [[NAME]] against Variables & Secrets every time it posts
# (bin/core/src/alert/slack.rs calls interpolate_string on the url before
# constructing the client). So the secret never touches this repo, and rotating
# it is a Variables edit with no redeploy.
#
# Prerequisite: create SLACK_WEBHOOK_URL under Settings -> Variables, marked
# secret, holding the incoming-webhook URL from your Slack app. Until it exists
# the alerter posts to the literal string and fails.
#
# Test it from the alerter's page — that fires the `Test` alert type, which is
# deliberately in the list below so the test actually arrives.
# ---------------------------------------------------------------------------

[[alerter]]
name = "slack"
description = "Slack Alerts."

[alerter.config]
enabled = true

# WHY THIS LIST IS EXPLICIT RATHER THAN EMPTY.
#
# An empty list forwards every variant, and one of them is ScheduleRun. The
# poll-git-redeploy procedure below runs every ten minutes, so "everything"
# means about 144 Slack messages a day that say nothing happened. That single
# type is the entire reason this is a whitelist. Everything else in
# AlertDataVariant is now here.
#
# WHAT THIS LIST DOES AND DOES NOT CONTROL. It filters DELIVERY only. Core
# computes and stores every alert regardless, so the web UI shows alerts that
# never reach Slack. If something appears in the UI and not in Slack, it is
# missing from this list — that is the only mechanism.
#
# ORDERING: this key must come BEFORE [alerter.config.endpoint]. TOML assigns
# bare keys to the most recent table header, so putting it after would silently
# make it endpoint.alert_types, which Komodo ignores.
#
# The two that used to be deliberately excluded, ServerCpu and ServerMem, are
# in now. CPU alerts are enabled on the server above since builds moved to CI.
# ServerMem cannot currently fire — the graph is pinned at 0.00 GB, see the
# long note on send_mem_alerts — but carrying it costs nothing and means the
# alerter needs no edit when that is fixed upstream.
#
# THE ONE TO DROP FIRST IF THIS GETS NOISY: ContainerStateChange. It fires per
# container rather than per stack, and this box runs about twenty, so a
# redeploy can produce a burst. StackStateChange alone covers the same ground
# more coarsely.
#
# StackImageUpdateAvailable is newly useful: every stack sets
# poll_for_updates = true now, so this is how a new published image announces
# itself while auto_update stays off.
alert_types = [
  # -- the box --
  "ServerUnreachable",
  "ServerCpu",
  "ServerMem",
  "ServerDisk",
  "ServerVersionMismatch",

  # -- things running on it --
  "StackStateChange",
  "ContainerStateChange",
  "StackImageUpdateAvailable",
  "StackAutoUpdated",
  "DeploymentImageUpdateAvailable",
  "DeploymentAutoUpdated",

  # -- things that failed --
  "ProcedureFailed",
  "ActionFailed",
  "BuildFailed",
  "RepoBuildFailed",
  "ResourceSyncPendingUpdates",

  # -- never fires here, free to carry --
  "SwarmUnhealthy",
  "AwsBuilderTerminationFailed",
  "Custom",

  # -- proves the path end to end from the alerter's Test button --
  "Test",
]

[alerter.config.endpoint]
type = "Slack"
params.url = "[[SLACK_WEBHOOK_URL]]"
