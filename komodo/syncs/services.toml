# One stack per service, all declared here.
#
# LAYOUT
#   komodo/syncs/services.toml   this file — one [[stack]] block per service
#   services/<name>.yml          that service's compose file
#
# The declaration lives in komodo/syncs because that is the sync's resource
# path, so it is picked up with no change to the sync's configuration. The
# compose files live in services/ where they are easy to find and edit.
#
# Each service is its own Komodo stack and therefore its own compose project.
# That is the point of the split: a bad image in one cannot fail the deploy of
# the others, and redeploying one leaves the rest untouched. The earlier
# version of this folder was a single compose file with every service in it,
# which was fewer lines and one shared blast radius.
#
# ADDING A SERVICE
#   1. services/<name>.yml — the compose. Two rules:
#        - `expose:` plus caddy labels, never `ports:`. A host port bypasses
#          Cloudflare Access and publishes the service to the LAN.
#        - named volumes, never `./data`. Komodo clones this repo to
#          /etc/komodo/stacks/<name>/, so a relative path anchors wherever the
#          clone landed rather than where you meant.
#   2. Copy the template below, change the two names.
#   3. Push. It is running within ten minutes.
#
# THE FLAGS, AND WHY THEY ARE THE OPPOSITE OF apps.toml
# Everything here runs a published image rather than building from source, so
# pulling is both possible and wanted:
#   auto_pull = true          get the newer image on redeploy, not a stale local one
#   poll_for_updates = true   surface a newer digest, raise StackImageUpdateAvailable
#   auto_update               left off. Turn it on per service once one has
#                             proved stable — that is also what makes the
#                             native StackAutoUpdated alert fire for it.
#
# SECRETS
# Add the variable in Komodo (Settings -> Variables), then on that service's
# block:
#   environment = """
#   SOMETHING_TOKEN=[[SOMETHING_TOKEN]]
#   """
# Komodo writes it to a .env in the run directory before compose runs.
#
# ---------------------------------------------------------------------------
# TEMPLATE — copy, uncomment, change `whoami` in both places.
# ---------------------------------------------------------------------------
#
# [[stack]]
# name = "whoami"
# tags = ["app"]
#
# [stack.config]
# server = "Local"
# git_provider = "github.com"
# repo = "namanvashistha/homelab"
# branch = "main"
# run_directory = "services"
# file_paths = ["whoami.yml"]
# run_build = false
# auto_pull = true
# poll_for_updates = true
# auto_update = false
#
# ---------------------------------------------------------------------------
# Services below.
# ---------------------------------------------------------------------------

[[stack]]
name = "whoami"
description = "Echo server — proves the tunnel -> caddy -> container path."
tags = ["app"]

[stack.config]
server = "Local"
git_provider = "github.com"
repo = "namanvashistha/homelab"
branch = "main"
run_directory = "services"
file_paths = ["whoami.yml"]
run_build = false
auto_pull = true
poll_for_updates = true
auto_update = false
