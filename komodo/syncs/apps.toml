# The bot is the reason the old deploy.sh could never be fully retired: its
# compose declares `env_file: .env`, a file that is not in git, so a controller
# that clones into its own directory had nothing to give it. Komodo solves that
# directly — `environment` below is written to `.env` in the run directory
# before compose runs, with values resolved from the Secrets store.
[[stack]]
name = "text-to-image-bot"
description = "Telegram bot that renders text into cards."
tags = ["app"]

[stack.config]
server = "Local"
git_provider = "github.com"
repo = "namanvashistha/text-to-image-bot"
branch = "main"
file_paths = ["docker-compose.yml"]
run_build = true
auto_pull = false
poll_for_updates = false
webhook_enabled = true
# Create these three in Komodo under Settings -> Variables, marking the token
# as secret. The names match what bot.py reads.
environment = """
TELEGRAM_BOT_TOKEN=[[TELEGRAM_BOT_TOKEN]]
IMAGE_USERNAME=[[IMAGE_USERNAME]]
IMAGE_DISPLAY_NAME=[[IMAGE_DISPLAY_NAME]]
"""

# salt.md — self-hosted docs/database workspace with an MCP server, one Go
# binary over one SQLite file. Sourced straight from upstream; Komodo clones
# the repo so the Dockerfile and web assets come with it.
#
# Their compose publishes 8420 on the host and carries no caddy label, so this
# lands on the LAN at <box-ip>:8420, NOT at a *.namanvashistha.com hostname.
# Routing it means owning the file: copy docker-compose.yml into
# stacks/salt/compose.yaml, drop `ports:`, add the two caddy labels.
#
# Builds from source (Go + web), so expect the first deploy to take a while.
# Upstream also publishes ghcr.io/saltmd/salt.md:latest — switching to it also
# requires owning the file, since their compose has it commented out.
#
# Their commits to main redeploy this on the poller's next pass. Pin with
# `commit = "<sha>"` if that ever matters.
[[stack]]
name = "salt"
description = "salt.md — docs + database workspace with MCP, from saltmd/salt.md."
tags = ["app"]

[stack.config]
server = "Local"
git_provider = "github.com"
repo = "saltmd/salt.md"
branch = "main"
file_paths = ["docker-compose.yml"]
run_build = true
auto_pull = false
poll_for_updates = false
